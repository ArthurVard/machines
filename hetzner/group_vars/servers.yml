---
# How Ansible reaches a server: the IPv4 in your inventory.yml (ansible_host), as admin_user, offering only admin_ssh_key_file.
# (These live here, not in all.yml: the implicit localhost that runs the Hetzner API tasks also reads all.yml.)
ansible_user: "{{ admin_user }}"
ansible_ssh_private_key_file: "{{ admin_ssh_key_file }}"

# After a rebuild the server has a new host key: accept an unknown key on first contact (a changed key still stops SSH).
ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"
